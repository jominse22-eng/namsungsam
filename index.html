<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설월여자고등학교 디지털 현미경 사진전</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Teal
                            600: '#0d9488',
                            700: '#0f766e',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
        }
        /* Custom Scrollbar for modern look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .img-hover-zoom {
            transition: transform 0.5s ease;
        }
        .card-container:hover .img-hover-zoom {
            transform: scale(1.05);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center text-2xl shadow-inner">
                    <i class="fa-solid fa-microscope"></i>
                </div>
                <div>
                    <h2 class="text-sm font-semibold text-slate-500 tracking-wider">설월여자고등학교</h2>
                    <h1 class="text-2xl font-bold text-slate-900">제1회 디지털 현미경 사진전</h1>
                </div>
            </div>
            <button onclick="openModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-full font-medium transition-colors shadow-md flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> 작품 올리기
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Filter Controls -->
        <div class="flex flex-wrap items-center justify-center gap-3 mb-10" id="filter-container">
            <!-- Filter buttons will be generated by JS -->
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Cards will be generated by JS -->
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400">
            <i class="fa-regular fa-image text-6xl mb-4 text-slate-300"></i>
            <p class="text-lg">해당 반에 아직 등록된 사진이 없습니다.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-slate-500 text-sm">
            &copy; 2026 설월여자고등학교 과학동아리. All rights reserved.
        </div>
    </footer>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-300">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        
        <!-- Modal Content -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transition-all scale-95" id="modal-panel">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800">새 작품 업로드</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="upload-form" class="p-6 space-y-5">
                <!-- Image Input -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">현미경 사진 파일 <span class="text-red-500">*</span></label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-300 border-dashed rounded-xl hover:border-brand-500 transition-colors bg-slate-50 cursor-pointer" id="drop-zone" onclick="document.getElementById('file-upload').click()">
                        <div class="space-y-1 text-center">
                            <i class="fa-solid fa-camera text-3xl text-slate-400 mb-2"></i>
                            <div class="flex text-sm text-slate-600 justify-center">
                                <span class="relative rounded-md font-medium text-brand-600 hover:text-brand-500 focus-within:outline-none">
                                    <span>파일 선택하기</span>
                                    <input id="file-upload" name="file-upload" type="file" class="sr-only" accept="image/*" required onchange="handleFileSelect(event)">
                                </span>
                            </div>
                            <p class="text-xs text-slate-500" id="file-name-display">PNG, JPG, GIF (최대 10MB)</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Title -->
                    <div class="col-span-2">
                        <label for="title" class="block text-sm font-medium text-slate-700 mb-1">작품명 <span class="text-red-500">*</span></label>
                        <input type="text" id="title" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow" placeholder="예: 양파 표피세포의 신비">
                    </div>
                    
                    <!-- Class -->
                    <div>
                        <label for="class-select" class="block text-sm font-medium text-slate-700 mb-1">소속 반 <span class="text-red-500">*</span></label>
                        <select id="class-select" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow bg-white">
                            <option value="">반 선택</option>
                            <option value="1반">1반</option>
                            <option value="2반">2반</option>
                            <option value="3반">3반</option>
                            <option value="4반">4반</option>
                            <option value="5반">5반</option>
                        </select>
                    </div>

                    <!-- Name -->
                    <div>
                        <label for="student-name" class="block text-sm font-medium text-slate-700 mb-1">이름 <span class="text-red-500">*</span></label>
                        <input type="text" id="student-name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow" placeholder="홍길동">
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-medium text-slate-700 mb-1">작품 설명 (관찰 내용 등)</label>
                    <textarea id="description" rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow resize-none" placeholder="배율: 400x. 세포벽과 핵이 뚜렷하게 관찰됩니다."></textarea>
                </div>

                <!-- Actions -->
                <div class="pt-2 flex gap-3 justify-end">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 border border-slate-300 rounded-lg text-slate-700 font-medium hover:bg-slate-50 transition-colors">취소</button>
                    <button type="submit" class="px-5 py-2.5 bg-brand-600 rounded-lg text-white font-medium hover:bg-brand-700 transition-colors shadow-md">업로드 완료</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-all duration-300 z-50">
        <i class="fa-solid fa-check-circle text-green-400"></i>
        <span id="toast-message">작품이 성공적으로 등록되었습니다.</span>
    </div>

    <script>
        // Mock Data: Initial gallery items
        let photos = [
            {
                id: 1,
                title: '양파 표피세포 관찰',
                studentName: '김지민',
                className: '1반',
                description: '아세트산카민 용액으로 염색한 양파 표피세포입니다. (400배율) 세포벽과 붉게 염색된 핵이 선명하게 보입니다.',
                // Using placeholder images that look artistic/scientific
                imageUrl: 'https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 2,
                title: '나뭇잎 기공',
                studentName: '이서연',
                className: '2반',
                description: '달개비 잎의 뒷면 표피를 벗겨 관찰한 기공과 공변세포입니다.',
                imageUrl: 'https://images.unsplash.com/photo-1582719471384-894fbb16e074?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 3,
                title: '혈액 도말 표본',
                studentName: '박하늘',
                className: '1반',
                description: '김사액으로 염색한 사람의 혈액입니다. 수많은 적혈구와 보라색으로 염색된 백혈구(호중구)를 확인할 수 있습니다.',
                imageUrl: 'https://images.unsplash.com/photo-1579154204601-01588f351e67?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 4,
                title: '짚신벌레의 이동',
                studentName: '최유리',
                className: '3반',
                description: '연못 물에서 채취한 짚신벌레가 섬모를 이용해 활발하게 움직이는 모습입니다.',
                imageUrl: 'https://images.unsplash.com/photo-1620353131649-ceb0c4d8ce81?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 5,
                title: '구강 상피세포',
                studentName: '정수진',
                className: '4반',
                description: '메틸렌블루 용액으로 염색한 입안 상피세포. 불규칙한 모양과 푸른색 핵이 특징입니다.',
                imageUrl: 'https://images.unsplash.com/photo-1530026405186-ed1f139313f8?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 6,
                title: '물벼룩 심장 박동',
                studentName: '강민지',
                className: '5반',
                description: '살아있는 물벼룩을 오목 받침유리에 놓고 관찰. 등 쪽에 있는 심장의 빠른 박동을 볼 수 있습니다.',
                imageUrl: 'https://images.unsplash.com/photo-1507668077129-56e32842fceb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
            }
        ];

        const classes = ['전체', '1반', '2반', '3반', '4반', '5반'];
        let currentFilter = '전체';
        let currentUploadedImageBase64 = null;

        // Initialize Page
        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderGallery();
        });

        // Render Filter Buttons
        function renderFilters() {
            const container = document.getElementById('filter-container');
            container.innerHTML = '';
            
            classes.forEach(cls => {
                const btn = document.createElement('button');
                const isActive = cls === currentFilter;
                
                // Style based on active state
                btn.className = isActive 
                    ? 'px-5 py-2 rounded-full text-sm font-bold bg-slate-800 text-white shadow-md transition-all'
                    : 'px-5 py-2 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm';
                
                btn.innerText = cls;
                btn.onclick = () => setFilter(cls);
                container.appendChild(btn);
            });
        }

        // Handle Filter Click
        function setFilter(cls) {
            currentFilter = cls;
            renderFilters(); // Update button styles
            renderGallery(); // Update grid
        }

        // Render Photo Gallery
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            const filteredPhotos = currentFilter === '전체' 
                ? photos 
                : photos.filter(p => p.className === currentFilter);

            if (filteredPhotos.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                // Sort by ID descending (newest first)
                const sortedPhotos = [...filteredPhotos].sort((a, b) => b.id - a.id);

                sortedPhotos.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'card-container bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-xl transition-all duration-300 group cursor-pointer flex flex-col h-full';
                    
                    card.innerHTML = `
                        <div class="relative w-full pt-[75%] bg-slate-200 overflow-hidden">
                            <img src="${photo.imageUrl}" alt="${photo.title}" class="absolute top-0 left-0 w-full h-full object-cover img-hover-zoom">
                            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-brand-700 shadow-sm">
                                ${photo.className}
                            </div>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <h3 class="text-lg font-bold text-slate-800 mb-1 group-hover:text-brand-600 transition-colors line-clamp-1">${photo.title}</h3>
                            <p class="text-sm text-slate-500 mb-3 font-medium"><i class="fa-regular fa-user mr-1"></i> ${photo.studentName}</p>
                            <p class="text-sm text-slate-600 line-clamp-2 mt-auto leading-relaxed">
                                ${photo.description}
                            </p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        // --- Modal & Upload Logic ---

        const modal = document.getElementById('upload-modal');
        const modalPanel = document.getElementById('modal-panel');
        const uploadForm = document.getElementById('upload-form');

        function openModal() {
            modal.classList.remove('hidden');
            // Trigger reflow
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalPanel.classList.remove('scale-95');
            modalPanel.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalPanel.classList.remove('scale-100');
            modalPanel.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                uploadForm.reset();
                document.getElementById('file-name-display').innerText = "PNG, JPG, GIF (최대 10MB)";
                document.getElementById('file-name-display').classList.remove('text-brand-600', 'font-bold');
                currentUploadedImageBase64 = null;
            }, 300); // match duration
        }

        // Handle File Selection (Simulating Upload via FileReader)
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('file-name-display').innerText = file.name;
                document.getElementById('file-name-display').classList.add('text-brand-600', 'font-bold');
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUploadedImageBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Handle Form Submission
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const className = document.getElementById('class-select').value;
            const studentName = document.getElementById('student-name').value;
            const description = document.getElementById('description').value;

            if(!currentUploadedImageBase64) {
                // Fallback if filereader failed or not completely loaded
                currentUploadedImageBase64 = 'https://images.unsplash.com/photo-1518152006812-edab29b069ac?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80';
            }

            const newPhoto = {
                id: Date.now(), // Unique ID
                title: title,
                className: className,
                studentName: studentName,
                description: description,
                imageUrl: currentUploadedImageBase64
            };

            photos.push(newPhoto);
            
            // Switch filter to the newly uploaded class or '전체'
            setFilter(className);
            
            closeModal();
            showToast();
        });

        // Toast Notification
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
